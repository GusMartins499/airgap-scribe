name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/airgap-scribe:${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "refs/tags/v${version}" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.released == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.version.outputs.released == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.released == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Create tag and GitHub release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.version.outputs.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${SHA}" 2>/dev/null || true)"
          gh release create "${TAG}" --target "${SHA}" --generate-notes \
            ${previous:+--notes-start-tag "${previous}"} \
            --notes "Image: \`${IMAGE}\`"
