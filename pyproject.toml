[project]
name = "airgap-scribe"
version = "0.1.0"
description = "Turn meeting recordings into anonymized written drafts without raw data leaving the machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["spacy>=3.8,<3.9"]

[project.scripts]
airgap-scribe = "airgap_scribe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airgap_scribe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=airgap_scribe",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
]

[tool.coverage.run]
branch = true
source = ["airgap_scribe"]

[tool.coverage.report]
exclude_also = ["raise NotImplementedError"]
show_missing = true
